        <div class="marg">
        <pre class="marg-t">---
name: via_genesis
description: &gt;-
  Invoke when building a new capability where none stood — the <span class="mk">Adeptus</span> rite of
  <span class="mk">Via Genesis</span>. Recall prior art → declare acceptance criteria → build the
  smallest whole that meets one → witness → record. Completion requires every
  acceptance criterion met, the build compiling and running, and a test covering
  the new behaviour. Improving existing behaviour is via_renovatio; fixing a bug
  is via_emendatio.
argument-hint: &lt;what to build, or a sara task id&gt;
allowed-tools: Bash(sara:*), Bash(herdr:*), Bash(git:status), Bash(git:log), Bash(git:diff), Bash(git:show), Bash(git:branch), Bash(git:fetch), Bash(git:ls-files), Bash(git:stash), Bash(gh:*), Read, Glob, Grep, Bash(python3:*)
---</pre>
        <aside class="marg-n">The trigger. It also names the squares this one is <em>not</em>.</aside>
        <pre class="marg-t"># <span class="mk">Via Genesis</span> — the rite of founding

You are bound by the `adeptus` creed and, as a rite of the **<span class="mk">Legio</span>** faction, its execution leges. The charge is:

$ARGUMENTS

Declare the <span class="mk">Via</span> aloud (**&quot;I take <span class="mk">Via Genesis</span>&quot;**), then walk its <span class="mk">Ritus</span> in order.</pre>
        <aside class="marg-n">Saying the name is what opens the block.</aside>
        <pre class="marg-t">Open **each phase** with its <span class="mk">Praeco</span> line (creed § *The <span class="mk">Praeco</span>*), naming the phase
and the Lex that binds it, before you walk it.</pre>
        <aside class="marg-n">Every phase announces itself. That is where the seams come from.</aside>
        <pre class="marg-t">## <span class="mk">Ritus</span> — walk in order, one phase at a time

1. **Recall prior art** (<span class="mk">Lex Recordi</span>). Bind the province first (<span class="mk">Lex Loci</span>): if this project has no `sara init` profile yet, `sara init` before recalling. `sara recall --tag &lt;topic&gt;` and `sara recall &quot;&lt;keywords&gt;&quot;` — do not rebuild what exists. On `sara add`, read the `similar` hits; while executing, heed the **Relevant memory** block `sara next` prints each step. This recall is a hard gate, not an optional courtesy.
2. **Declare the shape.** `sara add` the charge; set `sara assignment` (what was asked, verbatim) and `sara rationale` (why). Write the acceptance criteria that will end it: `sara check &lt;id&gt; &quot;&lt;criterion&gt;&quot; --kind acceptance --verify &quot;&lt;cmd&gt;&quot;`. No criteria = no definition of done.
3. **Build the smallest whole.** Implement the least that satisfies one criterion end-to-end before broadening. Drive with `sara next`; `sara step_done` each phase with a `result`.
4. **Witness (<span class="mk">Testes</span>).** Every criterion demonstrably met; the build compiles and runs; a test covers the new behaviour. `sara verify &lt;id&gt;`; tick acceptance with evidence.
5. **Record.** `sara learn --auto-files --tag &lt;topic&gt; &quot;&lt;what was built and why so&gt;&quot;`.</pre>
        <aside class="marg-n">Ordinary work inside a Latin edge &mdash; every command in here is plain <code>sara</code>.</aside>
        <pre class="marg-t">## <span class="mk">Testes</span> — no completion without these

- **Every acceptance criterion** demonstrably met.
- The build **compiles and runs**.
- A **test covers** the new behaviour.
- A **memory recorded** (recall→learn) on the files touched (<span class="mk">Lex Recordi</span>).</pre>
        <aside class="marg-n">What must be true before it may stop. Checked, not claimed.</aside>
        <pre class="marg-t">## Ending (<span class="mk">Lex Termini</span>)

When the <span class="mk">Testes</span> are green the charge is built and proven — call `sara done`.
Clean up scratch and throwaway probes first (<span class="mk">Lex Munditiae</span>). On a failed gate,
mend and re-walk — do not abandon or ask anew.</pre>
        <aside class="marg-n">A failed gate re-walks the block instead of ending it.</aside>
